[project]
name = "weather-tiles-pipeline"
version = "0.1.0"
description = "NOAA GFS + MRMS radar -> QC'd Cloud-Optimized GeoTIFFs -> web map tiles"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "eccodes>=2.38",
    "numpy>=1.26",
    "rasterio>=1.3",
    "rio-tiler>=6.2",
    "mercantile>=1.2",
    "pillow>=10",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Adjusting dataset latitudes:UserWarning"]
