name: publish-demo

# Rebuilds the GitHub Pages demo shortly after each GFS cycle is usually complete
# (cycles start at 00/06/12/18 UTC; the 24h forecast is out ~4h later).
on:
  schedule:
    - cron: "23 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WTP_DATA_DIR: data
      WTP_FORECAST_HOURS: "0,6,12,18,24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m pipeline.run
      - run: python -m pipeline.export --out site --max-zoom 4
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
