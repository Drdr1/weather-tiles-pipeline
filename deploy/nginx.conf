proxy_cache_path /var/cache/tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=12h use_temp_path=off;

server {
    listen 80;
    gzip on;
    gzip_types application/json text/css application/javascript;

    # Tiles: cached at the edge. Forecast tiles change only when a new cycle is
    # published; the 5-minute validity keeps radar reasonably fresh.
    location /tiles/ {
        proxy_pass http://tiles:8000;
        proxy_cache tiles;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;  # one render per tile under a burst of requests
        add_header X-Cache $upstream_cache_status;
    }

    location / {
        proxy_pass http://tiles:8000;
    }
}
